services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: carteirinha
      POSTGRES_USER: carteirinha
      POSTGRES_PASSWORD: carteirinha
    ports:
      - "5432:5432"
    volumes:
      - carteirinha_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carteirinha -d carteirinha"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  carteirinha_postgres:
